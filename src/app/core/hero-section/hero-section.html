<section #hero class="hero w-full min-h-150 relative overflow-hidden py-pad flex items-center" data-anim="pending">
  <!-- Background Image Layer (slow Ken Burns + scroll parallax) -->
  <div class="absolute inset-0 z-0 overflow-hidden">
    <img src="/assets/office_setup.png" alt="Ghana Office Operations" loading="lazy"
         class="hero-bg w-full h-[112%] object-cover opacity-50 mix-blend-overlay ken-burns" />
  </div>

  <!-- Solid Color & Gradient Overlay to match navy vibe -->
  <div class="absolute inset-0 bg-navy/60 z-0"></div>
  <div class="absolute inset-0 bg-linear-to-r from-navy/95 via-navy/85 to-navy/70 z-0"></div>

  <!-- Ambient light: aurora wash + drifting orbs -->
  <div class="aurora z-0"></div>
  <div class="glow-orb hero-orb hero-orb-1 z-0"></div>
  <div class="glow-orb hero-orb hero-orb-2 z-0"></div>

  <div class="hero-inner w-full max-w-295 mx-auto px-6 relative z-10 flex flex-col lg:flex-row items-center gap-12 lg:gap-16">

    <!-- Left Column: Content -->
    <div class="w-full lg:w-1/2 flex flex-col space-y-8 text-center lg:text-left">
      <span class="hero-kicker kicker anim inline-flex items-center gap-2 justify-center lg:justify-start">
        <span class="hero-badge__dot"></span>
        Open Base Africa
      </span>

      <h1 class="hero-title text-white anim">
        We Built &amp; Ran the Operation in Ghana<br class="hidden lg:block" /> for a US Ticket Brokerage
      </h1>

      <p class="hero-copy text-ink-light text-lead max-w-2xl mx-auto lg:mx-0 anim">
        That hands-on experience scaling from startup to 150+ staff is now available to you. Bridge operational gaps with proven, scalable offshore teams.
      </p>

      <div class="hero-actions flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-4 pt-2">
        <button data-booking-modal class="anim btn-shine w-full sm:w-auto btn-primary px-8 py-0 h-[60px] text-lg">
          Book a Consultation
        </button>
        <button routerLink="/projects" class="anim w-full sm:w-auto bg-transparent hover:bg-white/5 text-white font-semibold text-lg px-8 py-3.5 rounded-[5px] border border-white/80 transition-all duration-300">
          View Projects
        </button>
      </div>
    </div>

    <!-- Right Column: Image -->
    <div class="w-full lg:w-1/2 flex justify-center lg:justify-end">
      <!-- Image Frame matching the design -->
      <div class="hero-frame anim p-4 md:p-6 bg-navy/80 shadow-2xl rounded-[8px] w-full max-w-md lg:max-w-lg aspect-square relative border border-white/5">
        <div class="w-full h-full relative overflow-hidden group rounded-[4px]">
          <!-- Real operation photo -->
          <img
            src="/assets/meeting_room.png"
            loading="lazy"
            alt="Our team in action"
            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
          />
          <!-- Overlay to tint image blueish -->
          <div class="absolute inset-0 bg-[#0A1929]/30 mix-blend-multiply transition-opacity duration-300 group-hover:opacity-0"></div>
          <!-- Subtle inner border effect -->
          <div class="absolute inset-0 border border-white/10 pointer-events-none"></div>
        </div>

        <!-- Floating credential badge -->
        <div class="hero-badge anim float-slow">
          <span class="hero-badge__dot"></span>
          <span class="hero-badge__num">150+</span>
          <span class="hero-badge__label">Staff managed at peak</span>
        </div>
      </div>
    </div>

  </div>
</section>
